name: Validate Claude Code plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation tools
        run: |
          python -m pip install -r plugins/ai-video-reference-replication/requirements.txt
          npm install -g @anthropic-ai/claude-code
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg
      - name: Plugin and marketplace manifests
        run: |
          claude plugin validate . --strict
          claude plugin validate plugins/ai-video-reference-replication --strict
      - name: Delivery and production contract tests
        run: python -m pytest -q -p no:cacheprovider plugins/ai-video-reference-replication/tests plugins/ai-video-reference-replication/skills/ai-video-reference-replication/tests
